name: Publish public content to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "tools/validate_public_content.py"
      - ".github/workflows/public-content-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-public-content
  cancel-in-progress: true

jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate public content
        run: python tools/validate_public_content.py

      - name: Test public content validation
        run: python -m unittest discover -s tools -p "test_validate_public_content.py" -v

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: content
          include-hidden-files: true

  deploy:
    needs: validate-and-upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
