<!doctype html>

<head>

  <title>T3FAP 在线帮助中心</title>
  <link rel="canonical" href="https://qq85423296.github.io/T3FAP/help/">

<body class="help-page">
  <a class="help-skip" href="#help-article">跳到正文</a>
  <header class="help-topbar">
    <div class="help-topbar__inner">
      <a class="help-brand" href="../" aria-label="返回 T3FAP 首页"><span class="help-brand__mark" aria-hidden="true">T3</span><span class="help-brand__text">T3FAP <small>帮助中心</small></span></a>
      <div class="help-search" role="search">
        <label class="help-sr-only" for="help-search-input">搜索帮助文档</label>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input id="help-search-input" type="search" placeholder="搜索教程..." autocomplete="off" aria-expanded="false" aria-controls="help-search-results">
        <div id="help-search-results" class="help-search-results" hidden></div>
      </div>
      <button id="help-search-toggle" class="help-icon-button help-search-toggle" type="button" aria-label="打开教程搜索" aria-expanded="false" aria-controls="help-search-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      </button>
      <nav class="help-topbar__links" aria-label="帮助中心导航">
        <a href="../">项目首页</a>
        <a class="help-github-link" href="https://github.com/qq85423296/T3FAP" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <div class="help-channelbar">
    <nav id="help-channel-nav" class="help-channel-nav" aria-label="教程频道"></nav>
    <button id="help-menu-button" class="help-channel-current" type="button" aria-label="打开文档目录" aria-expanded="false" aria-controls="help-sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span id="help-channel-current">新手教程</span><span class="help-channel-current__suffix">正文</span>
    </button>
  </div>

  <div class="help-shell">
    <aside id="help-sidebar" class="help-sidebar" aria-label="文档目录">
      <div class="help-sidebar__top"><strong>T3FAP 教程</strong><button id="help-menu-close" class="help-icon-button" type="button" aria-label="关闭文档目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <nav id="help-nav" class="help-nav"></nav>
      <div class="help-sidebar__footer">
        <div class="help-status" role="status" aria-live="polite">
          <span id="help-source">正在读取在线教程…</span>
          <span id="help-warning" class="help-status__warning" hidden></span>
          <button id="help-retry" type="button" hidden>重新读取</button>
        </div>
        <span>遇到问题？</span><a id="help-faq-link" href="?doc=faq">先查常见问题</a>
      </div>
    </aside>
    <button id="help-backdrop" class="help-backdrop" type="button" aria-label="关闭文档目录" hidden></button>

    <main id="help-main" class="help-main">
      <div id="help-loading" class="help-loading" role="status"><span class="help-loading__line"></span><span class="help-loading__line help-loading__line--short"></span><p>正在准备中文操作步骤…</p></div>
      <article id="help-article" class="help-article" tabindex="-1" hidden></article>
      <div id="help-error" class="help-error" hidden>
        <h1>暂时没有读到教程</h1>
        <p id="help-error-message">请检查网络后重新读取。</p>
        <div class="help-error__actions"><button id="help-error-retry" class="help-button help-button--primary" type="button">重新读取</button><a class="help-button" href="https://github.com/qq85423296/T3FAP" target="_blank" rel="noopener noreferrer">打开 GitHub 仓库</a></div>
      </div>
      <noscript><div class="help-error"><h1>需要启用 JavaScript</h1><p>在线教程由结构化 JSON 生成。请启用 JavaScript，或到 GitHub 仓库查看原始文档。</p></div></noscript>
    </main>

    <aside class="help-outline" aria-label="本页目录">
      <div id="help-outline-content"><strong>页内目录</strong><p>读取文档后显示章节目录。</p></div>
    </aside>
  </div>

  <script type="module" src="./app.js"></script>

</html>
